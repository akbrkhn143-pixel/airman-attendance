<style>

    --teal:#0F3D3E; --teal-2:#155A5B;

    --red:#B5473A; --red-2:#8F372C;
    --gold:#C9A24B;
    --line:#E3DACB;
    --shadow: 0 4px 12px rgba(15, 61, 62, 0.08);
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--sand); font-family:'Manrope',sans-serif; color:var(--ink); min-height:100vh; }
  
  .top{ background:var(--teal); color:#F4EFE6; padding:20px; border-radius:0 0 22px 22px; box-shadow:0 4px 15px rgba(0,0,0,0.15); }
  .top-row{ display:flex; align-items:center; justify-content:space-between; gap:14px; }
  #cloudTop{ margin-top:12px; }
  .cloud-strip{ display:flex; align-items:center; justify-content:space-between; gap:10px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18); border-radius:12px; padding:8px 12px; }
  .cloud-strip .cs-txt{ font-size:0.78rem; font-weight:700; opacity:0.95; display:flex; align-items:center; gap:6px; }
  .cloud-strip .cs-btn{ background:#4285F4; color:#fff; border:none; padding:6px 12px; border-radius:9px; font-weight:800; font-size:0.75rem; cursor:pointer; display:flex; align-items:center; gap:6px; }
  .cloud-strip .cs-btn.out{ background:transparent; border:1px solid rgba(255,255,255,0.4); color:#F4EFE6; }
  .top .brand{ font-family:'Fraunces',serif; font-weight:700; font-size:1.4rem; }
  .top .sub{ font-size:0.7rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--gold); margin-top:2px; }
  .role-badge{ display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.25); padding:6px 12px; border-radius:20px; font-size:0.78rem; font-weight:700; color:#fff; }
  .role-btn{ background:var(--gold); color:var(--teal); border:none; padding:7px 14px; border-radius:10px; font-weight:800; font-size:0.8rem; cursor:pointer; transition:transform 0.15s ease, background 0.15s ease; box-shadow:0 2px 6px rgba(0,0,0,0.2); }
  .role-btn:active{ transform:scale(0.96); }

  .wrap{ max-width:540px; margin:0 auto; padding:16px 14px 60px; }

  .role-banner{ background:var(--paper); border-radius:14px; padding:12px 16px; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between; border:1.5px solid var(--line); box-shadow:var(--shadow); }
  .role-banner .txt{ font-size:0.85rem; font-weight:700; color:var(--teal); }
  .role-banner .subtxt{ font-size:0.72rem; color:#777; font-weight:500; }

  .tabbar{ display:flex; gap:6px; overflow-x:auto; margin-bottom:16px; padding:4px 2px; scrollbar-width:none; }
  .tabbar::-webkit-scrollbar{ display:none; }
  .tabbar button{ flex:none; padding:9px 14px; border-radius:10px; border:1.5px solid var(--line); background:var(--paper); color:var(--teal); font-weight:700; font-size:0.8rem; cursor:pointer; transition:all 0.2s ease; }
  .tabbar button.on{ background:var(--terra); color:#fff; border-color:var(--terra); box-shadow:0 2px 8px rgba(217,123,79,0.3); }

  .panel{ background:var(--paper); border-radius:16px; padding:18px; margin-bottom:14px; box-shadow:var(--shadow); border:1px solid rgba(227,218,203,0.6); }
  .h{ font-family:'Fraunces',serif; font-weight:700; color:var(--teal); font-size:1.15rem; margin:0 0 14px; display:flex; align-items:center; justify-content:space-between; }
  
  label{ display:block; font-size:0.75rem; font-weight:700; color:var(--olive-2); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:6px; }
  select, input[type=text], input[type=number], input[type=date], input[type=time], input[type=month], input[type=file], input[type=password]{
    width:100%; padding:12px 13px; border-radius:10px; border:1.5px solid var(--line); background:var(--sand); font-size:0.95rem; font-family:'Manrope',sans-serif; margin-bottom:14px; color:var(--ink); outline:none; transition:border-color 0.2s;
  }
  select:focus, input:focus{ border-color:var(--teal); }

  .btn{ width:100%; padding:13px; border-radius:11px; border:none; font-weight:800; font-size:0.92rem; cursor:pointer; margin-bottom:9px; letter-spacing:0.01em; transition:all 0.15s ease; display:inline-flex; align-items:center; justify-content:center; gap:8px; text-decoration:none; }
  .btn:active{ transform:scale(0.98); }
  .btn-terra{ background:var(--terra); color:#fff; }
  .btn-teal{ background:var(--teal); color:#fff; }
  .btn-olive{ background:var(--olive); color:#fff; }
  .btn-line{ background:transparent; border:1.5px solid var(--line); color:var(--teal); }
  .btn-red{ background:transparent; border:1.5px solid var(--red); color:var(--red-2); }
  .btn-sm{ padding:6px 12px; font-size:0.75rem; border-radius:8px; width:auto; margin:0; }

  .pill{ display:inline-block; padding:4px 10px; border-radius:20px; font-weight:800; font-size:0.72rem; border:1.5px solid; }
  .pill.present{ background:#E9F1E4; color:var(--olive-2); border-color:var(--olive); }
  .pill.half_day{ background:#FDF1E7; color:var(--terra-2); border-color:var(--terra); }
  .pill.weekly_off{ background:#EAEFF1; color:var(--teal); border-color:var(--teal); }
  .pill.holiday{ background:#FBF2DD; color:#8A6A1F; border-color:var(--gold); }
  .pill.emergency_leave{ background:#FBEAE7; color:var(--red-2); border-color:var(--red); }
  .pill.absent{ background:#F1E9E7; color:#7A3B2E; border-color:#7A3B2E; }
  .pill.none{ background:#EFEFEF; color:#999; border-color:#ccc; }

  .user-card{ background:linear-gradient(135deg, #155A5B, #0F3D3E); color:#fff; border-radius:18px; padding:20px; margin-bottom:16px; text-align:center; box-shadow:0 6px 18px rgba(15,61,62,0.25); }
  .user-card .uname{ font-family:'Fraunces',serif; font-size:1.35rem; font-weight:700; }
  .user-card .ustatus{ display:inline-block; margin-top:8px; padding:6px 16px; border-radius:20px; font-weight:800; font-size:0.85rem; letter-spacing:0.04em; }
  .user-card .ustatus.on{ background:#E9F1E4; color:var(--olive-2); }
  .user-card .ustatus.off{ background:#FBEAE7; color:var(--red-2); }
  .user-card .ustatus.not{ background:#F4EFE6; color:var(--ink); }

  .live-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
  .live-card{ background:var(--sand); border-radius:12px; padding:12px; border:1.5px solid var(--line); text-align:center; }
  .live-card .num{ font-family:'Space Mono',monospace; font-size:1.6rem; font-weight:700; }
  .live-card.on .num{ color:var(--olive-2); }
  .live-card.off .num{ color:var(--terra-2); }
  .live-card .lbl{ font-size:0.7rem; font-weight:800; text-transform:uppercase; color:#666; margin-top:2px; }

  .staff-duty-item{ display:flex; align-items:center; justify-content:space-between; padding:12px; border-radius:12px; border:1.5px solid var(--line); margin-bottom:8px; background:var(--paper); }
  .staff-duty-item .info{ display:flex; align-items:center; gap:12px; }
  .staff-duty-item .sname{ font-weight:800; font-size:0.95rem; }
  .staff-duty-item .stime{ font-size:0.75rem; color:#666; font-family:'Space Mono',monospace; margin-top:2px; }

  .arow{ border:1.5px solid var(--line); border-radius:12px; padding:13px; margin-bottom:10px; background:var(--paper); }
  .arow-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .arow-top .nm{ font-weight:800; font-size:0.95rem; }
  .arow-meta{ display:flex; gap:12px; flex-wrap:wrap; margin-top:8px; font-family:'Space Mono',monospace; font-size:0.74rem; color:#6b6b6b; }

  .flagged{ color:var(--red-2); font-weight:700; }
  .okflag{ color:var(--olive-2); }
  .editbtn{ border:none; background:var(--sand); color:var(--teal); font-size:0.82rem; font-weight:700; cursor:pointer; padding:6px 12px; border-radius:8px; border:1px solid var(--line); }
  .editbox{ background:var(--sand); border:1.5px dashed var(--line); border-radius:11px; padding:13px; margin-top:12px; }
  .empty{ text-align:center; color:#888; font-size:0.85rem; padding:20px 0; }
  .toast{ position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--teal); color:#fff; padding:11px 20px; border-radius:22px; font-size:0.85rem; box-shadow:0 6px 18px rgba(0,0,0,0.25); z-index:100; max-width:90%; text-align:center; font-weight:600; }
  .divider{ border-top:1.5px dashed var(--line); margin:16px 0; }

  .srow{ display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--line); padding:10px 0; }
  .srow:last-child{ border-bottom:none; }
  .srow .nm{ flex:1; font-weight:700; font-size:0.9rem; }
  .srow input[type=number]{ width:105px; margin:0; padding:9px; }
  .srow .rm{ background:none; border:none; color:var(--red-2); font-size:1.2rem; cursor:pointer; padding:4px 8px; }
  .lrow{ display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); font-size:0.85rem; }
  .lrow:last-child{ border-bottom:none; }
  .lrow .rm{ background:none; border:none; color:var(--red-2); cursor:pointer; font-size:1.1rem; }
  .chips{ display:flex; gap:10px; margin-bottom:14px; }
  .chip{ flex:1; text-align:center; padding:11px; border-radius:10px; background:var(--sand); border:1.5px solid var(--line); }
  .chip .l{ font-size:0.62rem; text-transform:uppercase; color:#888; letter-spacing:0.05em; }
  .chip .v{ font-family:'Space Mono',monospace; font-weight:700; font-size:1.05rem; margin-top:2px; }
  .row2{ display:flex; gap:10px; }
  .row2 .btn{ flex:1; }
  .row2 select{ flex:1; margin-bottom:14px; }
  .duty-block{ border-radius:10px; padding:10px 12px; margin-bottom:10px; border:1.5px solid; }
  .duty-block.duty-on{ background:#EEF6EA; border-color:var(--olive); }
  .duty-block.duty-off{ background:#FBEDE7; border-color:var(--terra); }
  .duty-label{ font-size:0.78rem; font-weight:800; margin-bottom:8px; letter-spacing:0.02em; }
  .duty-on .duty-label{ color:var(--olive-2); }
  .duty-off .duty-label{ color:var(--terra-2); }
  .duty-block select{ margin-bottom:0; background:var(--paper); }
  .time12-row{ display:flex; align-items:center; gap:6px; }
  .time12-row select.time12-sel{ margin-bottom:0; background:var(--paper); flex:1 1 0; min-width:0; padding:10px 6px; text-align:center; text-align-last:center; }
  .time12-row select.time12-ap{ flex:0.9 1 0; font-weight:800; }
  .time12-colon{ font-weight:800; opacity:0.6; }
  .note{ font-size:0.72rem; color:#888; margin-top:4px; line-height:1.5; }
  
  .regScroll{ overflow-x:auto; margin-bottom:14px; border:1.5px solid var(--line); border-radius:10px; }
  table.regTable{ border-collapse:collapse; width:100%; font-size:0.72rem; }
  table.regTable th, table.regTable td{ border:1px solid var(--line); padding:5px 6px; text-align:center; white-space:nowrap; min-width:78px; }
  table.regTable thead th{ background:var(--teal); color:#fff; position:sticky; top:0; z-index:2; }
  table.regTable td.nmcell, table.regTable th.nmcell{ position:sticky; left:0; background:var(--paper); text-align:left; font-weight:700; z-index:1; min-width:110px; }
  table.regTable thead th.nmcell{ background:var(--teal); color:#fff; z-index:3; }
  table.regTable td.wk{ background:#F4EFE6; color:#999; }

  #printArea{ display:none; }

  @media print{
    body *{ visibility:hidden; }
    #printArea, #printArea *{ visibility:visible; -webkit-print-color-adjust:exact; print-color-adjust:exact; color-adjust:exact; }
    #printArea{ display:block !important; position:absolute; top:0; left:0; width:100%; padding:0; }
    #printArea table{ width:calc(100% - 40px); margin:14px 20px; border-collapse:collapse; }
    #printArea th{ background:var(--teal); color:#fff; }
    #printArea th, #printArea td{ border:1px solid #999; padding:6px; font-size:12px; text-align:left; }
    #printArea tfoot td{ background:#FBF2DD; }
    #printArea .payHead{ background:linear-gradient(120deg,var(--teal),var(--teal-2)); color:#fff; padding:22px 20px; border-radius:0 0 16px 16px; }
    #printArea .payHead .pname{ font-family:'Fraunces',serif; font-weight:700; font-size:1.6rem; margin:0; }
    #printArea .payHead .ploc{ font-size:0.85rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--gold); margin-top:4px; }
    #printArea .payHead .ptitle{ font-family:'Fraunces',serif; font-weight:700; font-size:1.15rem; margin-top:14px; border-top:1.5px solid rgba(255,255,255,0.3); padding-top:12px; }
    #printArea .payHead .psub{ font-size:0.8rem; color:#B9C9C4; margin-top:2px; }
    #printArea h2, #printArea h4{ padding:0 20px; }
  }
</style>
</head>
<body>
  <div class="top">
    <div class="top-row">
      <div>
        <div class="brand">Airman Group</div>
        <div class="sub">Attendance &amp; Live Duty Register</div>
      </div>
      <div id="roleToggleArea"><div style="display:flex;align-items:center;gap:8px;"><span class="role-badge">🛡️ Admin</span><button class="role-btn" id="switchUserBtn">Switch to User</button></div></div>
    </div>
    <div id="cloudTop"></div>
  </div>

  <div class="wrap" id="app"></div>
  <div id="printArea"></div>

<script>
const SHIFT_HOURS = 9;
const STATUS_LABELS = { present:'Present', half_day:'Half Day', weekly_off:'Weekly Off', holiday:'Holiday Off', emergency_leave:'Emergency Leave', absent:'Absent' };
const STATUS_SHORT = { present:'P', half_day:'HD', weekly_off:'WO', holiday:'HO', emergency_leave:'EL', absent:'A' };
const STATUS_COLOR = {
  present:{bg:'#E9F1E4', fg:'#3F5233'}, half_day:{bg:'#FDF1E7', fg:'#B8613A'}, weekly_off:{bg:'#EAEFF1', fg:'#0F3D3E'},
  holiday:{bg:'#FBF2DD', fg:'#8A6A1F'}, emergency_leave:{bg:'#FBEAE7', fg:'#8F372C'}, absent:{bg:'#F1E9E7', fg:'#7A3B2E'}, none:{bg:'#EFEFEF', fg:'#999'}
};

const NS = 'airman-register-v4:';
const storage = {
  get(key){ const v = localStorage.getItem(NS+key); if(v===null) throw new Error('nf'); return {value:v}; },
  set(key, value){ localStorage.setItem(NS+key, value); scheduleAutoSave(); scheduleCloudSync(); },
  list(prefix){ const full=NS+(prefix||''); const keys=[]; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.startsWith(full)) keys.push(k.slice(NS.length)); } return keys; }
};

// ============ GMAIL LOGIN + CLOUD SYNC (Firebase) ============
const firebaseConfig = {
  apiKey: "AIzaSyBbOl7dTOArcAAJD8uRp9MujN0gi2z55_g",
  authDomain: "aakbartechlabs.firebaseapp.com",
  projectId: "aakbartechlabs",
  storageBucket: "aakbartechlabs.firebasestorage.app",
  messagingSenderId: "519831615122",
  appId: "1:519831615122:web:4635aa0c9699f41b2e984b",
  measurementId: "G-YV38KXNX9X"
};

let fbApp = null, fbAuth = null, fbDb = null;
let currentUser = null;
let cloudUnsub = null;
let cloudSyncTimer = null;
let applyingRemoteUpdate = false;

function isFirebaseConfigured(){
  return firebaseConfig.apiKey && !String(firebaseConfig.apiKey).startsWith('YOUR_');
}

function initFirebaseIfNeeded(){
  if(!isFirebaseConfigured() || fbApp) return;
  try{
    fbApp = firebase.initializeApp(firebaseConfig);
    fbAuth = firebase.auth();
    fbDb = firebase.firestore();
    fbAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(e=>{});
    fbAuth.onAuthStateChanged(user=>{
      if(user){
        currentUser = user;
        startCloudSync(user.uid);
        renderCloudStrip();
        render();
      }
    });
    setTimeout(()=>{
      if(!currentUser){
        try{
          const saved = localStorage.getItem(NS+'saved_auth');
          if(saved){
            const {email, password} = JSON.parse(saved);
            if(email && password && fbAuth){
              fbAuth.signInWithEmailAndPassword(email, password).then(res=>{
                currentUser = res.user;
                renderCloudStrip();
                render();
              }).catch(e=>{
                // Saved credentials no longer work — do NOT fake-login.
                // Clear them so the user is prompted to sign in again with the real modal.
                try{ localStorage.removeItem(NS+'saved_auth'); }catch(err){}
                currentUser = null;
                renderCloudStrip();
                render();
              });
            }
          }
        }catch(e){}
      }
    }, 800);
  }catch(e){ console.error('Firebase init failed', e); }
}

function openCloudModal(){
  initFirebaseIfNeeded();
  let modal = document.getElementById('cloudLoginModal');
  if(!modal){
    const container = document.createElement('div');
    container.id = 'cloudLoginModalContainer';
    container.innerHTML = `<div id="cloudLoginModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.65); z-index:9999; align-items:center; justify-content:center; padding:16px; backdrop-filter:blur(3px);">
      <div style="background:var(--paper); width:100%; max-width:400px; border-radius:20px; padding:24px; box-shadow:0 12px 36px rgba(0,0,0,0.3); border:1.5px solid var(--line);">
        <div class="h" style="font-size:1.2rem; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center;">
          <span>🔐 Cloud Sync Sign-In</span>
          <button id="closeCloudModalBtn" style="background:none; border:none; font-size:1.5rem; cursor:pointer; color:#888; padding:0 6px;">✕</button>
        </div>
        <div style="font-size:0.78rem; color:#666; margin-bottom:18px;">Ek baar login karein — har baar automatic logged-in rahega.</div>
        
        <label>Firebase Email</label>
        <input type="email" id="cloudEmailIn" value="user@airman.com" placeholder="e.g. user@airman.com" style="width:100%; padding:12px; border-radius:10px; border:1.5px solid var(--line); margin-bottom:14px; font-size:0.95rem; font-family:'Manrope',sans-serif;" />

        <label>Firebase Password</label>
        <div style="position:relative; margin-bottom:16px;">
          <input type="password" id="cloudPassIn" placeholder="••••••••" style="width:100%; padding:12px 42px 12px 12px; border-radius:10px; border:1.5px solid var(--line); margin-bottom:0; font-size:0.95rem; font-family:'Manrope',sans-serif;" />
          <button type="button" id="togglePassVis" style="position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; font-size:1.1rem; color:#666;" title="Toggle Password Visibility">👁️</button>
        </div>

        <label style="display:flex; align-items:center; gap:8px; cursor:pointer; text-transform:none; font-size:0.82rem; margin-bottom:18px; color:var(--teal); font-weight:700;">
          <input type="checkbox" id="cloudRemember" checked style="width:18px; height:18px; margin:0; accent-color:var(--teal);" />
          <span>Keep Me Logged In Forever (Auto-Sync)</span>
        </label>

        <button class="btn btn-teal" id="doCloudLoginBtn" style="margin-bottom:0; width:100%; padding:13px; font-size:0.95rem;">🔐 Sign In &amp; Start Cloud Sync</button>
      </div>
    </div>`;
    document.body.appendChild(container);
    modal = document.getElementById('cloudLoginModal');

    document.getElementById('closeCloudModalBtn').onclick = closeCloudModal;
    document.getElementById('togglePassVis').onclick = ()=>{
      const pIn = document.getElementById('cloudPassIn');
      if(pIn.type === 'password') pIn.type = 'text';
      else pIn.type = 'password';
    };
    document.getElementById('doCloudLoginBtn').onclick = doCloudLoginSubmit;
  }
  modal.style.display = 'flex';
}

function closeCloudModal(){
  const modal = document.getElementById('cloudLoginModal');
  if(modal) modal.style.display = 'none';
}

function doCloudLoginSubmit(){
  const email = document.getElementById('cloudEmailIn').value.trim();
  const password = document.getElementById('cloudPassIn').value;
  const remember = document.getElementById('cloudRemember').checked;

  if(!email || !password){ toast('Email aur Password dono daalein'); return; }

  const btn = document.getElementById('doCloudLoginBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Verifying Login...';

  if(fbAuth){
    fbAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(e=>{});
    fbAuth.signInWithEmailAndPassword(email, password).then(res => {
      btn.disabled = false;
      btn.textContent = '🔐 Sign In & Start Cloud Sync';
      if(remember){
        try{ localStorage.setItem(NS+'saved_auth', JSON.stringify({email, password})); }catch(e){}
      }
      closeCloudModal();
      toast(`✅ Signed in as ${res.user.email} — Always Auto-Logged In ☁️`);
    }).catch(err => {
      btn.disabled = false;
      btn.textContent = '🔐 Sign In & Start Cloud Sync';
      let msg = 'Login fail ho gaya — dobara try karein';
      if(err && err.code){
        if(err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') msg = '❌ Galat Email ya Password';
        else if(err.code === 'auth/user-not-found') msg = '❌ Ye Email registered nahi hai';
        else if(err.code === 'auth/invalid-email') msg = '❌ Email format galat hai';
        else if(err.code === 'auth/network-request-failed') msg = '❌ Network error — internet check karein';
        else if(err.code === 'auth/too-many-requests') msg = '❌ Bahut zyada attempts — thodi der baad try karein';
        else msg = `❌ Login fail: ${err.message || err.code}`;
      }
      toast(msg);
      // Do NOT fake-login on failure — currentUser stays unset so cloud sync never silently breaks
    });
  } else {
    btn.disabled = false;
    btn.textContent = '🔐 Sign In & Start Cloud Sync';
    toast('❌ Firebase abhi ready nahi hai — thodi der baad try karein ya page reload karein');

  }
}

function startCloudSync(uid){
  if(!fbDb) return;
  stopCloudSync();
  const docRef = fbDb.collection('airman_shared_data').doc(uid);
  cloudUnsub = docRef.onSnapshot(snap=>{
    if(snap.metadata.hasPendingWrites) return;
    const data = snap.data();
    if(data && data.payload){
      try{
        applyingRemoteUpdate = true;
        restoreFromPayload(JSON.parse(data.payload));
        applyingRemoteUpdate = false;
        pruneOldSelfies();
        render();
      }catch(e){ applyingRemoteUpdate = false; }
    } else if(!data){
      pushCloudSyncNow();
    }
  }, err=>{ console.error('Cloud sync error', err); });
}

function stopCloudSync(){
  if(cloudUnsub){ cloudUnsub(); cloudUnsub = null; }
  clearTimeout(cloudSyncTimer);
}

function scheduleCloudSync(){
  if(!currentUser || !fbDb || applyingRemoteUpdate) return;
  clearTimeout(cloudSyncTimer);
  cloudSyncTimer = setTimeout(pushCloudSyncNow, 800);
}

function pushCloudSyncNow(){
  if(!currentUser || !fbDb) return;
  const payload = buildBackupPayload();
  fbDb.collection('airman_shared_data').doc(currentUser.uid)
    .set({ payload: JSON.stringify(payload), updatedAt: new Date().toISOString() })
    .catch(e=>console.error('Cloud push failed', e));
}

let linkedFileHandle = null;
let autoSaveTimer = null;
const LINK_DB_NAME = 'airman-filelink-db';

function idbOpen(){
  return new Promise((res, rej)=>{
    const req = indexedDB.open(LINK_DB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore('handles'); };
    req.onsuccess = ()=>res(req.result);
    req.onerror = ()=>rej(req.error);
  });
}
async function idbSetHandle(handle){
  try{
    const db = await idbOpen();
    await new Promise((res, rej)=>{
      const tx = db.transaction('handles','readwrite');
      tx.objectStore('handles').put(handle, 'fileHandle');
      tx.oncomplete = res; tx.onerror = ()=>rej(tx.error);
    });
  }catch(e){}
}
async function idbGetHandle(){
  try{
    const db = await idbOpen();
    return await new Promise((res)=>{
      const tx = db.transaction('handles','readonly');
      const req = tx.objectStore('handles').get('fileHandle');
      req.onsuccess = ()=>res(req.result||null);
      req.onerror = ()=>res(null);
    });
  }catch(e){ return null; }
}

function buildBackupPayload(){
  const bkp = { staff: JSON.stringify(getStaff()), days:{}, ledgers:{}, exportedAt:new Date().toISOString() };
  storage.list('day:').forEach(k=>{ try{ bkp.days[k]=storage.get(k).value; }catch(e){} });
  storage.list('ledger:').forEach(k=>{ try{ bkp.ledgers[k]=storage.get(k).value; }catch(e){} });
  return bkp;
}
function restoreFromPayload(bkp){
  if(!bkp || typeof bkp !== 'object') throw new Error('bad file');
  if(bkp.staff) storage.set('staff', bkp.staff);
  if(bkp.days) Object.keys(bkp.days).forEach(k=>storage.set(k, bkp.days[k]));
  if(bkp.ledgers) Object.keys(bkp.ledgers).forEach(k=>storage.set(k, bkp.ledgers[k]));
  cache.staff = null;
}
async function writeToLinkedFile(){
  if(!linkedFileHandle) return;
  try{
    let perm = await linkedFileHandle.queryPermission({mode:'readwrite'});
    if(perm !== 'granted'){
      perm = await linkedFileHandle.requestPermission({mode:'readwrite'});
      if(perm !== 'granted') return;
    }
    const writable = await linkedFileHandle.createWritable();
    await writable.write(JSON.stringify(buildBackupPayload(), null, 2));
    await writable.close();
  }catch(e){}
}
function scheduleAutoSave(){
  if(!linkedFileHandle) return;
  clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(writeToLinkedFile, 500);
}

let pendingLinkHandle = null;
let autoReconnectAttached = false;

async function tryRestoreLink(){
  try{
    const handle = await idbGetHandle();
    if(!handle) return;
    const perm = await handle.queryPermission({mode:'readwrite'});
    if(perm === 'granted'){
      linkedFileHandle = handle;
    } else {
      pendingLinkHandle = handle;
      attachAutoReconnectListener();
    }
  }catch(e){}
}

function attachAutoReconnectListener(){
  if(autoReconnectAttached) return;
  autoReconnectAttached = true;
  const tryOnce = async ()=>{
    document.removeEventListener('click', tryOnce, true);
    document.removeEventListener('touchstart', tryOnce, true);
    autoReconnectAttached = false;
    if(!pendingLinkHandle || linkedFileHandle) return;
    try{
      const perm = await pendingLinkHandle.requestPermission({mode:'readwrite'});
      if(perm === 'granted'){
        linkedFileHandle = pendingLinkHandle;
        pendingLinkHandle = null;
        toast('🔗 Auto-Reconnected — Silent Save ON ✓');
        render();
      }
    }catch(e){}
  };
  document.addEventListener('click', tryOnce, true);
  document.addEventListener('touchstart', tryOnce, true);
}

async function linkFile(){
  if(!('showSaveFilePicker' in window)){ toast('❌ Ye browser Silent Auto-Link support nahi karta (Chrome/Edge use karein)'); return; }
  try{
    const handle = await window.showSaveFilePicker({
      suggestedName: 'airman-attendance-backup.json',
      types: [{ description:'JSON Backup', accept: {'application/json':['.json']} }]
    });
    const perm = await handle.requestPermission({mode:'readwrite'});
    if(perm !== 'granted'){ toast('Permission nahi mili'); return; }
    linkedFileHandle = handle;
    pendingLinkHandle = null;
    await idbSetHandle(handle);
    await writeToLinkedFile();
    toast('🔗 File Linked — Silent Auto-Save ON ✓');
    render();
  }catch(e){ if(e.name !== 'AbortError') toast('Link nahi ho paya'); }
}

async function reconnectLink(){
  try{
    const handle = pendingLinkHandle || await idbGetHandle();
    if(!handle){ toast('Koi linked file nahi mili, pehle Link karein'); return; }
    const perm = await handle.requestPermission({mode:'readwrite'});
    if(perm === 'granted'){ linkedFileHandle = handle; pendingLinkHandle = null; toast('🔗 Reconnected — Auto-Save ON ✓'); render(); }
    else toast('Permission denied');
  }catch(e){ toast('Reconnect fail hua'); }
}

async function unlinkFile(){
  linkedFileHandle = null;
  pendingLinkHandle = null;
  try{
    const db = await idbOpen();
    await new Promise((res, rej)=>{
      const tx = db.transaction('handles','readwrite');
      tx.objectStore('handles').delete('fileHandle');
      tx.oncomplete = res; tx.onerror = ()=>rej(tx.error);
    });
  }catch(e){}
  toast('File Unlink ho gaya, Auto-Save OFF'); render();
}

function todayStr(d=new Date()){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function daysInMonthArr(month){ const [y,m] = month.split('-').map(Number); const last = new Date(y, m, 0).getDate(); const arr = []; for(let d=1; d<=last; d++) arr.push(`${month}-${String(d).padStart(2,'0')}`); return arr; }
function daysInMonth(month){ const [y,m] = month.split('-').map(Number); return new Date(y, m, 0).getDate(); }
function isSundayStr(dateStr){ return new Date(dateStr+'T00:00:00').getDay()===0; }
function toMin(t){ const [h,m]=t.split(':').map(Number); return h*60+m; }
function fmtDur(min){ return `${Math.floor(min/60)}h ${String(min%60).padStart(2,'0')}m`; }
function niceDate(s){ return new Date(s+"T00:00:00").toLocaleDateString('en-IN',{weekday:'short',day:'2-digit',month:'short',year:'numeric'}); }
function monthYearLabel(s){ return new Date(s+"T00:00:00").toLocaleDateString('en-IN',{month:'long',year:'numeric'}); }
function uid(){ return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function to12(t){ if(!t) return ''; let [h,m]=t.split(':').map(Number); const ap=h>=12?'PM':'AM'; let h12=h%12||12; return `${h12}:${String(m).padStart(2,'0')} ${ap}`; }
function from24(t){
  if(!t) return {h:'09', m:'00', ap:'AM'};
  let [h,m] = t.split(':').map(Number);
  const ap = h>=12?'PM':'AM';
  let h12 = h%12; if(h12===0) h12=12;
  return {h:String(h12).padStart(2,'0'), m:String(m).padStart(2,'0'), ap};
}
function to24(h12, m, ap){
  let h = Number(h12)%12;
  if(ap==='PM') h += 12;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}
function time12Html(idPrefix, val24){

function esc(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function worked(e, hours){

function parseLatLong(input) {
  if(!input) return null;
  const str = String(input).trim();
  const match = str.match(/(-?\d+\.\d+)[,\s]+(-?\d+\.\d+)/);
  if(match){
    return { lat: Number(match[1]), lng: Number(match[2]) };
  }
  return null;
}

function calcDistanceMeters(lat1, lon1, lat2, lon2) {
  if(!lat1 || !lon1 || !lat2 || !lon2) return null;
  const R = 6371000;
  const dLat = (Number(lat2) - Number(lat1)) * Math.PI / 180;
  const dLon = (Number(lon2) - Number(lon1)) * Math.PI / 180;
  const a = 
    Math.sin(dLat/2) * Math.sin(dLat/2) +
    Math.cos(Number(lat1) * Math.PI / 180) * Math.cos(Number(lat2) * Math.PI / 180) * 
    Math.sin(dLon/2) * Math.sin(dLon/2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return Math.round(R * c);
}

const SELFIE_RETENTION_DAYS = 30;
function pruneOldSelfies(){
  try{
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - SELFIE_RETENTION_DAYS);
    const cutoffStr = todayStr(cutoff);
    const dayKeys = storage.list('day:');
    dayKeys.forEach(dateStr=>{
      if(dateStr >= cutoffStr) return;
      let rec;
      try{ rec = JSON.parse(storage.get('day:'+dateStr).value); }catch(e){ return; }
      let changed = false;
      Object.keys(rec).forEach(id=>{
        if(rec[id] && (rec[id].inSelfie || rec[id].outSelfie)){
          rec[id] = { ...rec[id], inSelfie: null, outSelfie: null };
          changed = true;
        }
      });
      if(changed) storage.set('day:'+dateStr, JSON.stringify(rec));
    });
  }catch(e){}
}

function getGPSLocation(){
  return new Promise((resolve)=>{
    if(!navigator.geolocation){
      resolve({ success: false, coordsStr: 'GPS Not Supported', mapsUrl: '#' });
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (pos)=>{
        const lat = pos.coords.latitude.toFixed(6);
        const lng = pos.coords.longitude.toFixed(6);
        resolve({
          success: true,
          lat: Number(lat),
          lng: Number(lng),
          coordsStr: `${lat}, ${lng}`,
          mapsUrl: `https://maps.google.com/?q=${lat},${lng}`
        });
      },
      (err)=>{
        let errTxt = 'Location Access Denied';
        if(err.code === err.TIMEOUT) errTxt = 'Location Timeout';
        else if(err.code === err.POSITION_UNAVAILABLE) errTxt = 'Location Unavailable';
        resolve({ success: false, coordsStr: errTxt, mapsUrl: '#' });
      },
      { enableHighAccuracy: true, timeout: 8000 }
    );
  });
}

              ? `<br>🔴 OFF DUTY Location: ${userEntry.outLoc.success ? `<a href="${userEntry.outLoc.mapsUrl}" target="_blank" style="color:var(--terra);text-decoration:underline;">📍 ${userEntry.outLoc.coordsStr}</a> ${userEntry.outLoc.distance !== undefined ? `<br><span style="font-size:0.75rem;color:var(--olive-2);">(${userEntry.outLoc.distance}m from Site)</span>` : ''}` : `<span style="color:var(--red-2);">${userEntry.outLoc.coordsStr}</span>`}`
              : ''}
          </div>
        </div>

        <div class="row2" style="margin-top:14px;">
          ${hasIn
            ? `<button class="btn btn-line" disabled style="opacity:0.55;cursor:not-allowed;">✅ ON DUTY Marked</button>`
            : `<button class="btn btn-terra" id="markOnDutyBtn">🟢 Mark ON DUTY (with GPS)</button>`}
          ${hasOut
            ? `<button class="btn btn-line" disabled style="opacity:0.55;cursor:not-allowed;">✅ OFF DUTY Marked</button>`
            : (hasIn ? `<button class="btn btn-red" id="markOffDutyBtn">🔴 Mark OFF DUTY (with GPS)</button>` : `<button class="btn btn-line" disabled style="opacity:0.55;cursor:not-allowed;">🔴 Mark OFF DUTY (with GPS)</button>`)}
        </div>
        ${(hasIn || hasOut) ? `<div class="note" style="text-align:center;margin-top:8px;">🔒 Aaj ka duty status lock ho chuka hai. Badlaav ke liye Admin se contact karein.</div>` : ''}
      `}
    </div>
  `;

  if(!selectedStaff) return;
  app.querySelector('#userSelect').onchange = e=>{ state.userStaffId = e.target.value; render(); };

  const markOnDutyBtn = app.querySelector('#markOnDutyBtn');
  if(markOnDutyBtn) markOnDutyBtn.onclick = async ()=>{
    const curTime = nowTime24();
    const dayData = getDay(todayStr());
    const existing = dayData[selectedStaff.id] || {};
    if(existing.in){ toast('✅ Aaj ON DUTY pehle se mark ho chuki hai.'); render(); return; }

    toast('📍 Fetching Live GPS Location...');
    markOnDutyBtn.disabled = true;
    markOnDutyBtn.textContent = '⏳ Verifying Location...';
    
    const gps = await getGPSLocation();
    if(!gps.success){
      toast('❌ Location Error: GPS Access Denied');
      render();
      return;
    }

    const tLat = selectedStaff.targetLat ? Number(selectedStaff.targetLat) : null;
    const tLng = selectedStaff.targetLng ? Number(selectedStaff.targetLng) : null;
    const radius = selectedStaff.allowedRadius ? Number(selectedStaff.allowedRadius) : 100;

    if(tLat && tLng){
      const dist = calcDistanceMeters(gps.lat, gps.lng, tLat, tLng);
      gps.distance = dist;
      gps.radius = radius;
      if(dist > radius){
        toast(`❌ Attendance Blocked! Aap Assigned Location se ${dist}m door hain. (Allowed: ${radius}m)`);
        render();
        return;
      }
    }

    dayData[selectedStaff.id] = { ...existing, status:'present', in:curTime, inLoc: gps };
    saveDay(todayStr(), dayData);
    toast(`🟢 ON DUTY Marked! ${gps.distance !== undefined ? `(Site se ${gps.distance}m door ✓)` : ''}`);
    render();
  };

  const markOffDutyBtn = app.querySelector('#markOffDutyBtn');
  if(markOffDutyBtn) markOffDutyBtn.onclick = async ()=>{
    const dayData = getDay(todayStr());
    const existing = dayData[selectedStaff.id];
    if(!existing || existing.status !== 'present' || !existing.in){ toast('Pehle ON DUTY mark karein!'); return; }
    if(existing.out){ toast('✅ Aaj OFF DUTY pehle se mark ho chuki hai.'); render(); return; }

    toast('📍 Fetching Live GPS Location...');
    markOffDutyBtn.disabled = true;
    markOffDutyBtn.textContent = '⏳ Verifying Location...';

    const gps = await getGPSLocation();
    if(!gps.success){
      toast('❌ Location Error: GPS Access Denied');
      render();
      return;
    }

    const tLat = selectedStaff.targetLat ? Number(selectedStaff.targetLat) : null;
    const tLng = selectedStaff.targetLng ? Number(selectedStaff.targetLng) : null;
    const radius = selectedStaff.allowedRadius ? Number(selectedStaff.allowedRadius) : 100;

    if(tLat && tLng){
      const dist = calcDistanceMeters(gps.lat, gps.lng, tLat, tLng);
      gps.distance = dist;
      gps.radius = radius;
      if(dist > radius){
        toast(`❌ Attendance Blocked! Aap Assigned Location se ${dist}m door hain. (Allowed: ${radius}m)`);
        render();
        return;
      }
    }

    const curTime = nowTime24();
    dayData[selectedStaff.id] = { ...existing, out:curTime, outLoc: gps };
    saveDay(todayStr(), dayData);
    toast(`🔴 OFF DUTY Marked! ${gps.distance !== undefined ? `(Site se ${gps.distance}m door ✓)` : ''}`);
    render();
  };
}

function rLiveDuty(app, staff){
  const todayRec = getDay(todayStr());
  const onDutyList = []; const offDutyList = [];

  staff.forEach(s => {
    const entry = todayRec[s.id];
    if(entry && entry.status === 'present' && entry.in && !entry.out) onDutyList.push({ staff: s, entry });
    else offDutyList.push({ staff: s, entry: entry || {} });
  });

  const onDutyHtml = onDutyList.length === 0 ? '<div class="empty">Koi staff On Duty nahi hain.</div>' : onDutyList.map(item => {
    const s = item.staff; const e = item.entry;
    const distTxt = (e.inLoc && e.inLoc.distance !== undefined) ? ` (${e.inLoc.distance}m away)` : '';
    const gpsHtml = (e.inLoc && e.inLoc.success)
      ? `<a href="${e.inLoc.mapsUrl}" target="_blank" style="font-size:0.75rem;color:var(--terra);font-weight:700;text-decoration:none;">📍 Map (${e.inLoc.coordsStr}${distTxt})</a>`
      : `<span style="font-size:0.75rem;color:#888;">In: ${to12(e.in)}</span>`;
    return `<div class="staff-duty-item" style="border-left:4px solid var(--olive);"><div class="info"><div style="width:40px;height:40px;border-radius:50%;background:var(--sand);display:flex;align-items:center;justify-content:center;font-size:1.1rem;border:1.5px solid var(--line);">🟢</div><div><div class="sname">${esc(s.name)}</div><div class="stime">In: <b>${to12(e.in)}</b> · ${gpsHtml}</div></div></div><span class="pill present">🟢 ON DUTY</span></div>`;
  }).join('');

  const offDutyHtml = offDutyList.length === 0 ? '<div class="empty">Sabhi staff On Duty hain!</div>' : offDutyList.map(item => {
    const s = item.staff; const e = item.entry;
    let badge = `<span class="pill none">Not Marked</span>`; let sub = 'Offline';
    if(e.status === 'present' && e.out){ badge = `<span class="pill half_day">Shift Done</span>`; sub = `Out: ${to12(e.out)}`; }
    else if(e.status){ badge = `<span class="pill ${e.status}">${STATUS_LABELS[e.status]}</span>`; sub = STATUS_LABELS[e.status]; }
    const distTxt = (e.outLoc && e.outLoc.distance !== undefined) ? ` (${e.outLoc.distance}m away)` : '';
    const gpsHtml = (e.outLoc && e.outLoc.success)
      ? `<a href="${e.outLoc.mapsUrl}" target="_blank" style="font-size:0.75rem;color:var(--terra);font-weight:700;text-decoration:none;">📍 Map (${e.outLoc.coordsStr}${distTxt})</a>`
      : '';
    return `<div class="staff-duty-item"><div class="info"><div style="width:40px;height:40px;border-radius:50%;background:var(--sand);display:flex;align-items:center;justify-content:center;font-size:1.1rem;border:1.5px solid var(--line);">🔴</div><div><div class="sname">${esc(s.name)}</div><div class="stime">${sub} ${gpsHtml ? '· ' + gpsHtml : ''}</div></div></div>${badge}</div>`;
  }).join('');

  app.innerHTML = `
    <div class="panel">
      <div class="h"><span>🟢 Real-Time Live Duty Board</span><span style="font-size:0.75rem;color:var(--gold);">${niceDate(todayStr())}</span></div>
      <div class="live-grid">
        <div class="live-card on"><div class="num">${onDutyList.length}</div><div class="lbl">🟢 On Duty Now</div></div>
        <div class="live-card off"><div class="num">${offDutyList.length}</div><div class="lbl">🔴 Off Duty / Not In</div></div>
      </div>
      <div class="h" style="font-size:0.95rem;margin-top:16px;">🟢 Currently On Duty Staff</div>
      ${onDutyHtml}
      <div class="divider"></div>
      <div class="h" style="font-size:0.95rem;">🔴 Off Duty / Other Status</div>
      ${offDutyHtml}
    </div>
  `;
}

function rAttendance(app, staff){
  if(!state.date) state.date = todayStr();
  const rec = getDay(state.date);

  const rows = staff.length===0 ? '<div class="empty">Pehle Staff add karein.</div>' : staff.map(s=>{
    const e = rec[s.id] || {}; const w = worked(e, s.hours); const st = e.status || '';
    const pillTxt = st ? STATUS_LABELS[st] : 'Not marked';
    
    let locRow = '';
    if(e.inLoc || e.outLoc){
      locRow = `<div class="arow-meta" style="margin-top:6px;color:var(--teal);">
        ${e.inLoc ? `<span>📍 In GPS: ${e.inLoc.success ? `<a href="${e.inLoc.mapsUrl}" target="_blank" style="color:var(--terra);font-weight:700;">${e.inLoc.coordsStr}</a> ${e.inLoc.distance!==undefined?`(${e.inLoc.distance}m away)`:''}` : `<span style="color:var(--red-2);">${e.inLoc.coordsStr}</span>`}</span>` : ''}
        ${e.outLoc ? `<span>📍 Out GPS: ${e.outLoc.success ? `<a href="${e.outLoc.mapsUrl}" target="_blank" style="color:var(--terra);font-weight:700;">${e.outLoc.coordsStr}</a> ${e.outLoc.distance!==undefined?`(${e.outLoc.distance}m away)`:''}` : `<span style="color:var(--red-2);">${e.outLoc.coordsStr}</span>`}</span>` : ''}
      </div>`;
    }

    let editor = '';
    if(state.editId === s.id){
      editor = `<div class="editbox">
        <label>Admin Status Override</label>
        <select id="stSel">
          <option value="" ${!st?'selected':''}>— Not marked —</option>
          <option value="present" ${st==='present'?'selected':''}>Present</option>
          <option value="half_day" ${st==='half_day'?'selected':''}>Half Day (50%)</option>
          <option value="weekly_off" ${st==='weekly_off'?'selected':''}>Weekly Off (Paid)</option>
          <option value="holiday" ${st==='holiday'?'selected':''}>Holiday (Paid)</option>
          <option value="emergency_leave" ${st==='emergency_leave'?'selected':''}>Emergency Leave</option>
          <option value="absent" ${st==='absent'?'selected':''}>Absent (Unpaid)</option>
        </select>

        <div id="timeBox" style="${st==='present'?'':'display:none;'}">
          <div class="duty-block duty-on">
            <div class="duty-label">🟢 Change On-Duty (In Time)</div>
            ${time12Html('editIn', e.in || '09:00')}
          </div>
          <div class="duty-block duty-off">
            <div class="duty-label">🔴 Change Off-Duty (Out Time)</div>
            ${time12Html('editOut', e.out || '18:00')}
          </div>
        </div>

        <div class="divider"></div>

        <div class="row2">
          <button class="btn btn-terra" id="saveBtn" data-id="${s.id}">💾 Save Changes</button>
          <button class="btn btn-red" id="delRecordBtn" data-id="${s.id}">🗑️ Delete Record</button>
        </div>
      </div>`;
    }

    return `<div class="arow">
      <div class="arow-top">
        <div class="nm">${esc(s.name)}</div>
        <div style="display:flex;align-items:center;gap:6px;">
          <span class="pill ${st||'none'}">${pillTxt}</span>
          <button class="editbtn" data-id="${s.id}">✎ Edit</button>
        </div>
      </div>
      ${st==='present'?`<div class="arow-meta"><span>In: ${to12(e.in)}</span><span>Out: ${to12(e.out)}</span><span>OT: ${w&&w.ot>0?fmtDur(w.ot):'none'}</span></div>`:''}
      ${locRow}
      ${editor}
    </div>`;
  }).join('');

  app.innerHTML = `
    <div class="panel">
      <div class="h"><span>📋 Admin Full Attendance Editor</span></div>
      <label>Date Select</label>
      <input type="date" id="dateIn" value="${state.date}" />
      ${rows}
    </div>
  `;

  app.querySelector('#dateIn').onchange = e=>{ state.date=e.target.value; state.editId=null; render(); };
  
  app.querySelectorAll('.editbtn').forEach(b=>{
    b.onclick=()=>{ state.editId = (state.editId===b.dataset.id)?null:b.dataset.id; render(); };
  });

  const stSel = app.querySelector('#stSel');
  if(stSel){
    stSel.onchange = ()=>{
      const timeBox = app.querySelector('#timeBox');
      if(timeBox) timeBox.style.display = stSel.value==='present'?'':'none';
    };
  }

  const saveBtn = app.querySelector('#saveBtn');
  if(saveBtn){
    saveBtn.onclick = ()=>{
      const id = saveBtn.dataset.id;
      const newSt = app.querySelector('#stSel').value;
      const fresh = getDay(state.date);
      const existing = fresh[id] || {};

      if(!newSt){
        delete fresh[id];
      } else if(newSt==='present'){
        const inV = readTime12('editIn');
        const outV = readTime12('editOut');
        fresh[id] = { ...existing, status:'present', in:inV, out:outV };
      } else {
        fresh[id] = { ...existing, status:newSt, in:null, out:null };
      }

      saveDay(state.date, fresh);
      toast('💾 Admin: Record Updated ✓');
      state.editId = null;
      render();
    };
  }

  const delRecordBtn = app.querySelector('#delRecordBtn');
  if(delRecordBtn){
    delRecordBtn.onclick = ()=>{
      const id = delRecordBtn.dataset.id;
      if(confirm('Admin: Aaj ka poora attendance record delete karna chahte hain?')){
        const fresh = getDay(state.date);
        delete fresh[id];
        saveDay(state.date, fresh);
        toast('🗑️ Record Deleted ✓');
        state.editId = null;
        render();
      }
    };
  }
}

    toast('Staff Added ✓'); render();

}

function rLedger(app, staff){
  if(!state.ledgerId && staff.length) state.ledgerId = staff[0].id;
  let body = '<div class="empty">Pehle Staff add karein.</div>';
  if(staff.length){
    const l = getLedger(state.ledgerId);
    const tf = l.fines.reduce((a,f)=>a+Number(f.amount),0);
    const given = l.advances.filter(f=>f.kind!=='repay').reduce((a,f)=>a+Number(f.amount),0);
    const repaid = l.advances.filter(f=>f.kind==='repay').reduce((a,f)=>a+Number(f.amount),0);
    const outstanding = given - repaid;
    const fr = l.fines.map(f=>`<div class="lrow" data-k="fines" data-id="${f.id}"><span>${f.date} — ₹${f.amount}${f.note?' ('+esc(f.note)+')':''}</span><button class="rm">✕</button></div>`).join('')||'<div class="empty">Koi fine nahi</div>';
    const ar = l.advances.map(f=>{
      const tag = f.kind==='repay' ? `<span style="color:var(--olive-2);font-weight:700;">Repayment</span>` : `<span style="color:var(--terra-2);font-weight:700;">Given</span>`;
      return `<div class="lrow" data-k="advances" data-id="${f.id}"><span>${tag} · ${f.date} — ₹${f.amount}${f.note?' ('+esc(f.note)+')':''}</span><button class="rm">✕</button></div>`;
    }).join('')||'<div class="empty">Koi advance nahi</div>';
    body = `
      <label>Staff Select</label>
      <select id="lSel">${staff.map(s=>`<option value="${s.id}" ${s.id===state.ledgerId?'selected':''}>${esc(s.name)}</option>`).join('')}</select>
      <div class="chips">
        <div class="chip"><div class="l">Total Fine</div><div class="v" style="color:var(--red-2)">₹${tf}</div></div>
        <div class="chip"><div class="l">Outstanding Advance</div><div class="v" style="color:var(--terra-2)">₹${outstanding}</div></div>
      </div>
      <div class="h" style="font-size:0.9rem;">Fine Entries</div>${fr}
      <div class="divider"></div>
      <div class="h" style="font-size:0.9rem;">Advance Entries</div>${ar}
      <div class="divider"></div>
      <label>Add Entry</label>
      <select id="lType">
        <option value="fines">Fine</option>
        <option value="advance_given">Advance Given (Paisa Diya)</option>
        <option value="advance_repay">Advance Repayment (Salary se Katega)</option>
      </select>
      <label>Amount (₹)</label><input type="number" id="lAmt" placeholder="e.g. 500" />
      <label>Date</label><input type="date" id="lDate" value="${todayStr()}" />
      <label>Note (optional)</label><input type="text" id="lNote" placeholder="Reason" />
      <button class="btn btn-teal" id="lAddBtn">+ Add Entry</button>
    `;
  }
  app.innerHTML = `<div class="panel"><div class="h">Fine &amp; Advance Ledger</div>${body}</div>`;
  const sel = app.querySelector('#lSel'); if(sel) sel.onchange = ()=>{ state.ledgerId=sel.value; render(); };
  const add = app.querySelector('#lAddBtn');
  if(add) add.onclick = ()=>{
    const type = app.querySelector('#lType').value, amt = app.querySelector('#lAmt').value;
    const date = app.querySelector('#lDate').value || todayStr(); const note = app.querySelector('#lNote').value.trim();
    if(!amt || Number(amt)<=0){ toast('Amount daalein'); return; }
    const l = getLedger(state.ledgerId);
    if(type==='fines'){ l.fines.push({ id:uid(), date, amount:Number(amt), note }); }
    else if(type==='advance_given'){ l.advances.push({ id:uid(), date, amount:Number(amt), note, kind:'given' }); }
    else if(type==='advance_repay'){ l.advances.push({ id:uid(), date, amount:Number(amt), note, kind:'repay' }); }
    saveLedgerF(state.ledgerId, l); toast('Entry Added ✓'); render();
  };
  app.querySelectorAll('.lrow .rm').forEach(btn=>{
    btn.onclick = ()=>{ const row=btn.closest('.lrow'); const k=row.dataset.k, id=row.dataset.id; const l=getLedger(state.ledgerId); l[k]=l[k].filter(x=>x.id!==id); saveLedgerF(state.ledgerId, l); render(); };
  });
}

function monthlyAtt(staffId, month, hours){
  const keys = storage.list('day:'+month+'-');
  let present=0, half=0, weeklyOff=0, holiday=0, emgPaid=0, emgUnpaid=0, absent=0, ot=0;
  keys.forEach(k=>{
    let rec; try{ rec=JSON.parse(storage.get(k).value); }catch(e){ return; }
    const e = rec[staffId]; if(!e||!e.status) return;
    if(e.status==='present'){ present++; const w=worked(e, hours); if(w) ot+=w.ot; }
    else if(e.status==='half_day') half++;
    else if(e.status==='weekly_off') weeklyOff++;
    else if(e.status==='holiday') holiday++;
    else if(e.status==='emergency_leave'){ if(e.paid) emgPaid++; else emgUnpaid++; }
    else if(e.status==='absent') absent++;
  });
  return { present, half, weeklyOff, holiday, emgPaid, emgUnpaid, absent, ot };
}
function monthLedger(staffId, month){
  const l = getLedger(staffId);
  const fine = l.fines.filter(f=>f.date&&f.date.startsWith(month)).reduce((a,f)=>a+Number(f.amount),0);
  const adv = l.advances.filter(f=>f.kind==='repay' && f.date&&f.date.startsWith(month)).reduce((a,f)=>a+Number(f.amount),0);
  return { fine, adv };
}
function calcSalary(s, month){
  const sh = (Number(s.hours)>0) ? Number(s.hours) : SHIFT_HOURS;
  const a = monthlyAtt(s.id, month, sh);
  const basic = Number(s.salary)||0;
  const dim = daysInMonth(month);
  const perDay = basic/dim, perHour = perDay/sh;
  const paidLeaveDays = a.weeklyOff + a.holiday + a.emgPaid;
  const absentTotal = a.absent + a.emgUnpaid;
  const base = (a.present+paidLeaveDays)*perDay + a.half*0.5*perDay;
  const otPay = (a.ot/60)*perHour;
  const gross = base+otPay;
  const {fine,adv} = monthLedger(s.id, month);
  const l = getLedger(s.id);
  const givenTotal = l.advances.filter(f=>f.kind!=='repay').reduce((x,f)=>x+Number(f.amount),0);
  const repaidTotal = l.advances.filter(f=>f.kind==='repay').reduce((x,f)=>x+Number(f.amount),0);
  const outstanding = givenTotal - repaidTotal;
  return { ...a, paidLeaveDays, absentTotal, basic, dim, perDay, perHour, base, otPay, gross, fine, adv, outstanding, net: gross-fine-adv };
}

    const r = calcSalary(s, month);

      <div class="arow-top"><div class="nm">${esc(s.name)}</div><div style="font-family:'Space Mono',monospace;font-weight:700;color:var(--olive-2);">₹${r.net.toFixed(0)}</div></div>
      <div class="arow-meta"><span>Present ${r.present}</span><span>Half ${r.half}</span><span>Wkly Off ${r.weeklyOff}</span><span>Holiday ${r.holiday}</span></div>

      <div class="arow-meta" style="margin-top:4px;"><span>Base ₹${r.base.toFixed(0)}</span><span>OT Pay ₹${r.otPay.toFixed(0)}</span><span class="flagged">Fine -₹${r.fine.toFixed(0)}</span><span class="flagged">Adv Kata -₹${r.adv.toFixed(0)}</span></div>
    </div>`;

  app.innerHTML = `<div class="panel"><div class="h">Monthly Salary Calculation</div>

    ${staff.length>0?`<div class="chips"><div class="chip"><div class="l">Total OT (Month)</div><div class="v" style="color:${grandOtMin>0?'var(--red-2)':'inherit'}">${fmtDur(grandOtMin)}</div></div></div>`:''}
    ${cards}

    <div class="row2">
      <button class="btn btn-line" id="sCsv">⬇ Excel (XLSX)</button>

    if(typeof ExcelJS === 'undefined'){ toast('Excel library load nahi hui'); return; }

    const ws = wb.addWorksheet('Salary');
    const cols = ['Name','Basic Salary','Present','Half Day','Weekly Off','Holiday','Emg(Paid)','Emg(Unpaid)','Absent','OT Hours','Rate/Day','Base Pay','OT Pay','Fine','Advance Kata','Net Payable'];
    ws.addRow(cols);
    staff.forEach((s)=>{
      const r = calcSalary(s, month);
      ws.addRow([s.name, r.basic, r.present, r.half, r.weeklyOff, r.holiday, r.emgPaid, r.emgUnpaid, r.absent, fmtDur(r.ot), r.perDay.toFixed(0), r.base.toFixed(0), r.otPay.toFixed(0), r.fine.toFixed(0), r.adv.toFixed(0), r.net.toFixed(0)]);
    });
    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const url = URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=`salary-payout-${month}.xlsx`; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    toast('Salary Excel Sheet Downloaded ✓');

  if(pdf) pdf.onclick = ()=>{
    let grandNet = 0;

}

function rReport(app, staff){
  if(!state.reportMonth) state.reportMonth = todayStr().slice(0,7);
  const month = state.reportMonth;
  const days = daysInMonthArr(month);

  if(staff.length===0){
    app.innerHTML = `<div class="panel"><div class="h">Monthly Report</div><div class="empty">Pehle Staff add karein.</div></div>`;
    return;
  }

  const dayRecs = {};
  days.forEach(d=>{ dayRecs[d] = getDay(d); });

  const headCells = staff.map(s=>`<th>${esc(s.name)}</th>`).join('');
  const bodyRows = days.map(d=>{
    const dNum = Number(d.slice(8,10));
    const sunday = isSundayStr(d);
    const cells = staff.map(s=>{
      const e = dayRecs[d][s.id];
      const st = e && e.status ? e.status : 'none';
      const col = STATUS_COLOR[st];
      const w = e ? worked(e, s.hours) : null;
      const otTxt = (w && w.ot>0) ? `<div style="font-size:0.62rem;color:var(--red-2);font-weight:700;">+${(w.ot/60).toFixed(1)}h OT</div>` : '';
      const timeTxt = (e && e.in && e.out) ? `<div style="font-size:0.62rem;font-weight:600;">${to12(e.in)}–${to12(e.out)}</div>` : '';
      return `<td style="background:${col.bg};color:${col.fg};font-weight:700;">${st==='none'?'—':STATUS_SHORT[st]}${timeTxt}${otTxt}</td>`;
    }).join('');
    return `<tr><td class="nmcell${sunday?' wk':''}">${dNum} ${sunday?'(Sun)':''}</td>${cells}</tr>`;
  }).join('');

  app.innerHTML = `<div class="panel">
    <div class="h">Monthly Full Calendar Register</div>
    <label>Month Select</label><input type="month" id="rIn" value="${month}" />
    <div class="regScroll">
      <table class="regTable">
        <thead><tr><th class="nmcell">Date</th>${headCells}</tr></thead>
        <tbody>${bodyRows}</tbody>
      </table>
    </div>
    <div class="row2">
      <button class="btn btn-line" id="rCsv">⬇ Excel (XLSX)</button>
      <button class="btn btn-line" id="rPdf">🖨 Print / PDF</button>
    </div>
  </div>`;

  app.querySelector('#rIn').onchange = e=>{ state.reportMonth = e.target.value; render(); };

  app.querySelector('#rCsv').onclick = async ()=>{
    if(typeof ExcelJS === 'undefined'){ toast('Excel library load nahi hui'); return; }
    const wb = new ExcelJS.Workbook();
    const ws = wb.addWorksheet('Monthly Register');
    const cols = ['Date', ...staff.map(s=>s.name)];
    ws.addRow(cols);
    days.forEach(d=>{
      const dNum = Number(d.slice(8,10));
      const sunday = isSundayStr(d);
      const row = [`${dNum}${sunday?' (Sun)':''}`];
      staff.forEach(s=>{
        const e = dayRecs[d][s.id];
        const st = e && e.status ? e.status : 'none';
        let cell = st==='none' ? '—' : STATUS_SHORT[st];
        if(e && e.in && e.out) cell += ` ${to12(e.in)}-${to12(e.out)}`;
        const w = e ? worked(e, s.hours) : null;
        if(w && w.ot>0) cell += ` (+${(w.ot/60).toFixed(1)}h OT)`;
        row.push(cell);
      });
      ws.addRow(row);
    });
    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const url = URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=`monthly-register-${month}.xlsx`; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    toast('Monthly Register Excel Downloaded ✓');
  };

  app.querySelector('#rPdf').onclick = ()=>{
    const trs = days.map(d=>{
      const dNum = Number(d.slice(8,10));
      const sunday = isSundayStr(d);
      const cells = staff.map(s=>{
        const e = dayRecs[d][s.id];
        const st = e && e.status ? e.status : 'none';
        let txt = st==='none' ? '—' : STATUS_SHORT[st];
        if(e && e.in && e.out) txt += `<br><span style="font-size:10px;">${to12(e.in)}–${to12(e.out)}</span>`;
        return `<td>${txt}</td>`;
      }).join('');
      return `<tr><td>${dNum}${sunday?' (Sun)':''}</td>${cells}</tr>`;
    }).join('');
    document.getElementById('printArea').innerHTML = `<h2>Airman Group</h2><h4>Monthly Full Calendar Register — ${monthYearLabel(month+'-01')}</h4>
      <table><thead><tr><th>Date</th>${staff.map(s=>`<th>${esc(s.name)}</th>`).join('')}</tr></thead><tbody>${trs}</tbody></table>`;
    window.print();
  };
}

  app.innerHTML = `<div class="panel">
    <div class="h">☁️ Firebase Cloud Sync</div>
    <div class="role-banner" style="margin-bottom:14px;">
      <div><div class="txt">${cloudOn?'🟢 Cloud Sync ON':'⚪ Cloud Sync OFF'}</div><div class="subtxt">${cloudOn?('Signed in as '+esc(currentUser.email)):'Firebase Email/Password se sab devices par same live data sync hoga'}</div></div>

    </div>

    `:`<div class="note" style="margin-bottom:14px;">⚠️ Ye browser Silent Auto-Link support nahi karta. Neeche दिए Manual Download/Restore use karein, ya Chrome/Edge browser try karein.</div>`}
    <div class="divider"></div>
    <button class="btn btn-olive" id="dlBtn">⬇ Download Backup Now (Manual)</button>
    <div class="divider"></div>
    <div class="h" style="font-size:1rem;">📤 Restore Backup</div>
    <div class="note" style="margin-bottom:8px;">Ek purani backup JSON file select karein — current data replace ho jayega.</div>
    <label class="cam-btn-label" style="background:var(--terra);">📤 Choose Backup File to Restore<input type="file" id="restoreIn" accept="application/json,.json" /></label>
  </div>`;

  const cloudSignInBtn2 = app.querySelector('#cloudSignInBtn2');
  if(cloudSignInBtn2) cloudSignInBtn2.onclick = signInEmail;
  const cloudSignOutBtn2 = app.querySelector('#cloudSignOutBtn2');
  if(cloudSignOutBtn2) cloudSignOutBtn2.onclick = signOutGoogle;

  const linkBtn = app.querySelector('#linkBtn');
  if(linkBtn) linkBtn.onclick = linkFile;
  const reconnectBtn = app.querySelector('#reconnectBtn');
  if(reconnectBtn) reconnectBtn.onclick = reconnectLink;
  const unlinkBtn = app.querySelector('#unlinkBtn');
  if(unlinkBtn) unlinkBtn.onclick = unlinkFile;
  app.querySelector('#dlBtn').onclick = downloadBackupNow;
  app.querySelector('#restoreIn').onchange = e=>{
    const file = e.target.files[0];
    if(file) handleRestoreFile(file);
    e.target.value = '';
  };
}
